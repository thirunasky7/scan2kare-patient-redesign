name: scan2kare
description: A new doctor booking app.
publish_to: none
version: 1.0.0+17

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: 5.4.0
  provider: 6.1.1
  google_fonts: ^8.1.0
  carousel_slider: 5.0.0
  flutter_svg: ^2.0.10
  intl: 0.19.0
  table_calendar: 3.1.2
  image_picker: 1.0.7
  permission_handler: 11.3.1
  shared_preferences: 2.2.2
  geocoding: 3.0.0
  geolocator: 11.0.0
  google_maps_flutter: 2.6.0
  flutter_google_places_sdk: ^0.3.4
  mobile_scanner: ^7.2.0
  url_launcher: ^6.2.4
  cached_network_image: ^3.3.0
  file_picker: ^8.0.0
  youtube_player_flutter: ^9.1.3
  app_links: ^6.3.2
  go_router: ^14.6.2
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  flutter_launcher_icons: 0.13.1

dependency_overrides:
  flutter_inappwebview: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/Scan2kare-icon.png