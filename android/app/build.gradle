plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.scan2kare.patient"
    compileSdk = 36
    // Use Flutter's bundled/default NDK to avoid CMake JSON/NDK mismatch errors
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                // Fallback to debug signing if no keystore properties
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeFile file('../debug.keystore')
                storePassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId "com.scan2kare.patient"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        minSdkVersion = flutter.minSdkVersion
        targetSdk = 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Play Store compatibility for Android 14
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:asset-delivery:2.1.0'
    implementation 'com.google.android.play:review:2.0.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'
}
